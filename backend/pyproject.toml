[project]
name = "datavista-backend"
version = "0.1.0"
description = "Multi-tenant analytics backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.35",
  "psycopg[binary]>=3.2.1",
  "pydantic-settings>=2.5.2",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "python-multipart>=0.0.9",
  "pandas>=2.2.2",
  "openpyxl>=3.1.5",
  "redis>=5.0.8",
  "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.2", "httpx>=0.27.2", "ruff>=0.6.8"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["app"]
